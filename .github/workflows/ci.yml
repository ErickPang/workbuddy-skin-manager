name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: ${{ matrix.rust_targets }}
      - name: Install frontend dependencies
        run: npm ci
      - name: Check frontend and theme engine
        run: npm run check
      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Test Rust
        working-directory: src-tauri
        run: cargo test
      - name: Lint Rust
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Build unsigned macOS Universal DMG
        if: runner.os == 'macOS'
        run: npm run bundle:macos -- --no-sign
      - name: Build unsigned Windows x64 NSIS installer
        if: runner.os == 'Windows'
        run: npm run bundle:windows -- --no-sign
